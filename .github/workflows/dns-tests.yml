name: Huawei DNS E2E Tests

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      candidate_artifact:
        required: true
        type: string
    secrets:
      HUAWEICLOUD_AK:
        required: false
      HUAWEICLOUD_SK:
        required: false
  workflow_dispatch:
    inputs:
      no_reuse:
        description: Create fresh environments explicitly
        type: boolean
        default: false
  schedule:
    - cron: "23 19 * * *"
  push:
    branches: [main]
    paths:
      - backend/**
      - e2e/**
      - Dockerfile
      - .dockerignore
      - .github/**
      - scripts/release/**
      - scripts/ci/**

permissions:
  contents: read

concurrency:
  group: huawei-dns-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.candidate_artifact == '' }}
    uses: ./.github/workflows/candidate.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  huawei:
    name: Huawei DNS and Minecraft connectivity
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_artifact != '')) }}
    environment: dns-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_DIRECTORY: ${{ github.workspace }}/.dns-e2e-runs
      E2E_RUN_ID: dns-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_NO_REUSE: ${{ inputs.no_reuse || false }}
      HUAWEICLOUD_DNS_ZONE: ${{ vars.HUAWEICLOUD_DNS_ZONE }}
      HUAWEICLOUD_DNS_PARENT: ${{ vars.HUAWEICLOUD_DNS_PARENT }}
      HUAWEICLOUD_DNS_REGION: ${{ vars.HUAWEICLOUD_DNS_REGION }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install OCI transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact || needs.build.outputs.artifact }}
          path: e2e-artifacts
      - name: Prepare immutable runtime
        run: |
          chmod +x e2e-artifacts/mc-admin-e2e
          uv run --no-project python scripts/release/candidate.py verify --directory e2e-artifacts --revision "${{ inputs.source_sha || github.sha }}"
          uv run --no-project python scripts/release/candidate.py load --directory e2e-artifacts --tag mc-admin:dns-e2e --output "$RUNNER_TEMP/loaded-candidate.json"
          echo "E2E_IMAGE=$(python -c 'import json; print(json.load(open("e2e-artifacts/candidate.json"))["config_digest"])')" >> "$GITHUB_ENV"
      - name: Qualify Huawei DNS and recover every owned scope
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
        run: |
          umask 077
          config_file=$(mktemp "$RUNNER_TEMP/dns-external.XXXXXX")
          export DNS_CONFIG_FILE="$config_file"
          recover() {
            status=$?
            trap - EXIT
            set +e
            bash scripts/ci/recover_dns.sh ./e2e-artifacts/mc-admin-e2e "$E2E_DIRECTORY/$E2E_RUN_ID" "$config_file" "$E2E_IMAGE" || status=1
            rm -f "$config_file"
            exit "$status"
          }
          trap recover EXIT
          uv run --no-project python scripts/ci/dns_config.py "$config_file"
          reuse_args=()
          if [ "$E2E_NO_REUSE" = true ]; then reuse_args+=(--no-reuse); fi
          ./e2e-artifacts/mc-admin-e2e run \
            --backend-image "$E2E_IMAGE" --output "$E2E_DIRECTORY" --run-id "$E2E_RUN_ID" \
            --workers 1 --mc-slots 1 --seed "${{ github.run_id }}" \
            --tag dns --case '^dns\.huawei-' --external-config "$config_file" "${reuse_args[@]}"
      - name: Recover cloud scopes after success, failure or cancellation
        if: ${{ always() && env.E2E_IMAGE != '' }}
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
        run: |
          umask 077
          config_file=$(mktemp "$RUNNER_TEMP/dns-recovery.XXXXXX")
          trap 'rm -f "$config_file"' EXIT
          uv run --no-project python scripts/ci/dns_config.py "$config_file"
          bash scripts/ci/recover_dns.sh ./e2e-artifacts/mc-admin-e2e "$E2E_DIRECTORY/$E2E_RUN_ID" "$config_file" "$E2E_IMAGE"
      - name: Audit cloud case coverage and candidate evidence
        run: |
          ./e2e-artifacts/mc-admin-e2e coverage --require-complete --output dns-coverage "$E2E_DIRECTORY/$E2E_RUN_ID"
          uv run --no-project python scripts/release/candidate.py evidence \
            --directory e2e-artifacts --revision "${{ inputs.source_sha || github.sha }}" \
            --runtime-kind api --run-directory "$E2E_DIRECTORY/$E2E_RUN_ID" \
            --output "$E2E_DIRECTORY/$E2E_RUN_ID/candidate-evidence.json"
          uv run --no-project python - <<'PY'
          import json, os, pathlib
          manifests = list((pathlib.Path(os.environ["E2E_DIRECTORY"]) / os.environ["E2E_RUN_ID"] / "cloud").glob("*.json"))
          if len(manifests) != 2 or not all(json.loads(p.read_text())["cleaned"] for p in manifests):
              raise SystemExit("every Huawei case must have verified cloud cleanup")
          PY
          cat dns-coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports and non-secret recovery manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: huawei-dns-results
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/plan.json
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/results.json
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/junit.xml
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/manifest.json
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/candidate-evidence.json
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/cloud/
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/cases/
            ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/environments/
            dns-coverage/
