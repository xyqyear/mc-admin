name: API E2E Tests
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      candidate_artifact:
        required: true
        type: string
      qualification:
        type: boolean
        default: false
    secrets:
      E2E_EXTERNAL_CONFIG:
        required: false
      HUAWEICLOUD_AK:
        required: false
      HUAWEICLOUD_SK:
        required: false
  push:
    branches:
    - '**'
    paths:
    - backend/**
    - frontend-react/**
    - e2e/**
    - Dockerfile
    - .dockerignore
    - .github/**
    - scripts/release/**
    - scripts/ci/**
  pull_request:
    paths:
    - backend/**
    - frontend-react/**
    - e2e/**
    - Dockerfile
    - .dockerignore
    - .github/**
    - scripts/release/**
    - scripts/ci/**
  workflow_dispatch:
    inputs:
      selection:
        description: API test selection; DNSPod needs E2E_EXTERNAL_CONFIG
        type: choice
        options:
        - regression
        - qualification
        - dnspod
        default: regression
      no_reuse:
        description: Create a fresh environment for every case
        type: boolean
        default: false
  schedule:
  - cron: 23 19 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: api-tests-${{ (inputs.source_sha != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.source_sha == '' && github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  REQUESTED_PROFILE: ${{ inputs.selection || 'regression' }}
  QUALIFICATION: ${{ inputs.qualification || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
  NO_REUSE: ${{ inputs.no_reuse || false }}
jobs:
  build:
    if: ${{ inputs.candidate_artifact == '' }}
    uses: ./.github/workflows/candidate.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
  plan:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_artifact != '')) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
      history_profile: ${{ steps.plan.outputs.history_profile }}
      compatibility: ${{ steps.plan.outputs.compatibility }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v8.1.0
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.candidate_artifact || needs.build.outputs.artifact }}
        path: e2e-artifacts
    - name: Freeze historical source and immutable current API plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x e2e-artifacts/mc-admin-e2e
        uv run --no-project python scripts/release/candidate.py verify --directory e2e-artifacts --revision "$SOURCE_SHA"
        profile="$REQUESTED_PROFILE"
        if [ "$QUALIFICATION" = true ]; then profile=qualification; fi
        history_profile="$profile"
        reuse_args=()
        if [ "$NO_REUSE" = true ]; then history_profile="$profile-no-reuse"; reuse_args+=(--no-reuse); fi
        compatibility=$(uv run --no-project python scripts/ci/timing_history.py fingerprint --file e2e/go.sum --file Dockerfile --setting measurement=api-lifecycle-v2 --setting "reuse=$NO_REUSE" --setting workers=2 --setting mc-slots=1 --setting fixtures=backend-v1,server-v1,world-v1,connectivity-v1)
        mkdir -p api-planning
        uv run --no-project python scripts/ci/timing_history.py restore --component api --profile "$history_profile" --compatibility "$compatibility" --output api-planning/history.json
        image=$(python -c 'import json; print(json.load(open("e2e-artifacts/candidate.json"))["config_digest"])')
        ./e2e-artifacts/mc-admin-e2e ci-plan --profile "$profile" --revision "$SOURCE_SHA" --backend-image "$image" --history api-planning/history.json --compatibility "$compatibility" --seed "${{ github.run_id }}" --workers 2 --mc-slots 1 --budget-seconds 300 --max-shards 16 --output api-planning/plan.json --github-output "$GITHUB_OUTPUT" "${reuse_args[@]}"
        echo "history_profile=$history_profile" >> "$GITHUB_OUTPUT"
        echo "compatibility=$compatibility" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      with:
        name: api-plan
        path: api-planning/
        retention-days: 90
        if-no-files-found: error
  api:
    name: API cases (shard ${{ matrix.shard }}/${{ matrix.count }})
    needs:
    - build
    - plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment:
      name: dns-e2e
    env:
      E2E_DIRECTORY: ${{ github.workspace }}/.e2e-runs
      E2E_RUN_ID: api-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
      E2E_PROFILE: ${{ needs.plan.outputs.profile }}
      E2E_PROVIDERS: ${{ toJSON(matrix.providers) }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v8.1.0
    - name: Install OCI transfer tool
      run: sudo apt-get update && sudo apt-get install -y skopeo
    - name: Download runtime inputs
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.candidate_artifact || needs.build.outputs.artifact }}
        path: e2e-artifacts
    - uses: actions/download-artifact@v8
      with:
        name: api-plan
        path: api-planning
    - name: Prepare runtime inputs
      run: |
        chmod +x e2e-artifacts/mc-admin-e2e
        uv run --no-project python scripts/release/candidate.py verify --directory e2e-artifacts --revision "$SOURCE_SHA"
        uv run --no-project python scripts/release/candidate.py load --directory e2e-artifacts --tag mc-admin:e2e --output "$RUNNER_TEMP/loaded-candidate.json"
        echo "E2E_IMAGE=$(python -c 'import json; print(json.load(open("e2e-artifacts/candidate.json"))["config_digest"])')" >> "$GITHUB_ENV"
    - name: Execute planned cases and recover owned scopes
      env:
        E2E_EXTERNAL_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.selection == 'dnspod' && contains(matrix.providers, 'dnspod') && secrets.E2E_EXTERNAL_CONFIG || '' }}
        HUAWEICLOUD_AK: ${{ contains(matrix.providers, 'huawei') && secrets.HUAWEICLOUD_AK || '' }}
        HUAWEICLOUD_SK: ${{ contains(matrix.providers, 'huawei') && secrets.HUAWEICLOUD_SK || '' }}
        HUAWEICLOUD_DNS_ZONE: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_ZONE || '' }}
        HUAWEICLOUD_DNS_PARENT: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_PARENT || '' }}
        HUAWEICLOUD_DNS_REGION: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_REGION || '' }}
      run: bash scripts/ci/api_shard.sh run
    - name: Recover after success, failure or cancellation
      if: ${{ always() && env.E2E_IMAGE != '' }}
      env:
        E2E_EXTERNAL_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.selection == 'dnspod' && contains(matrix.providers, 'dnspod') && secrets.E2E_EXTERNAL_CONFIG || '' }}
        HUAWEICLOUD_AK: ${{ contains(matrix.providers, 'huawei') && secrets.HUAWEICLOUD_AK || '' }}
        HUAWEICLOUD_SK: ${{ contains(matrix.providers, 'huawei') && secrets.HUAWEICLOUD_SK || '' }}
        HUAWEICLOUD_DNS_ZONE: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_ZONE || '' }}
        HUAWEICLOUD_DNS_PARENT: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_PARENT || '' }}
        HUAWEICLOUD_DNS_REGION: ${{ contains(matrix.providers, 'huawei') && vars.HUAWEICLOUD_DNS_REGION || '' }}
      run: bash scripts/ci/api_shard.sh recover
    - name: Verify API image, outcomes and cleanup against the candidate
      run: |
        uv run --no-project python scripts/release/candidate.py evidence \
          --directory e2e-artifacts --revision "$SOURCE_SHA" \
          --runtime-kind api --run-directory "$E2E_DIRECTORY/$E2E_RUN_ID" \
          --output "$E2E_DIRECTORY/$E2E_RUN_ID/candidate-evidence.json"
    - name: Upload reports and redacted diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: api-results-${{ matrix.shard }}
        overwrite: true
        retention-days: 30
        if-no-files-found: error
        path: |
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/plan.json
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/results.json
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/junit.xml
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/recovery.json
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/manifest.json
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/candidate-evidence.json
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/cases/
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/environments/
          ${{ env.E2E_DIRECTORY }}/${{ env.E2E_RUN_ID }}/cloud/
  coverage:
    name: Audit complete case and shard coverage
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
    - build
    - plan
    - api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source_sha || github.sha }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@v8.1.0
    - name: Download executable
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.candidate_artifact || needs.build.outputs.artifact }}
        path: e2e-artifacts
    - uses: actions/download-artifact@v8
      with:
        name: api-plan
        path: api-planning
    - name: Download separate shard reports
      uses: actions/download-artifact@v8
      with:
        pattern: api-results-*
        path: shard-reports
        merge-multiple: false
    - name: Audit independently required catalog, identity and cloud cleanup
      env:
        EXECUTION_RESULT: ${{ needs.api.result }}
      run: |
        chmod +x e2e-artifacts/mc-admin-e2e
        uv run --no-project python scripts/release/candidate.py verify --directory e2e-artifacts --revision "$SOURCE_SHA"
        profile="$REQUESTED_PROFILE"
        if [ "$QUALIFICATION" = true ]; then profile=qualification; fi
        test "$EXECUTION_RESULT" = success
        image=$(python -c 'import json; print(json.load(open("e2e-artifacts/candidate.json"))["config_digest"])')
        audit_args=()
        if [ "$NO_REUSE" = true ]; then audit_args+=(--no-reuse); fi
        if [ "$profile" = regression ] || [ "$profile" = qualification ]; then audit_args+=(--require-observed); fi
        shopt -s nullglob
        reports=(shard-reports/api-results-*/)
        if [ -f shard-reports/results.json ]; then reports+=(shard-reports); fi
        ./e2e-artifacts/mc-admin-e2e ci-audit --plan api-planning/plan.json --profile "$profile" --revision "$SOURCE_SHA" --backend-image "$image" --output coverage "${audit_args[@]}" "${reports[@]}"
    - name: Publish audited API lifecycle history
      run: |
        uv run --no-project python scripts/ci/timing_history.py publish --component api --profile "${{ needs.plan.outputs.history_profile }}" --compatibility "${{ needs.plan.outputs.compatibility }}" --costs coverage/costs.json --output coverage/history.json
    - uses: actions/upload-artifact@v7
      with:
        name: timing-history-api
        path: coverage/history.json
        retention-days: 90
        if-no-files-found: error
    - name: Add API observations to job summary
      if: always()
      run: |
        if [ -f coverage/coverage.md ]; then
          cat coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload coverage audit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-coverage
        overwrite: true
        path: coverage/
        retention-days: 7
        if-no-files-found: error
