name: DNS propagation timing diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: DNS propagation probe ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dns-e2e
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      PROBE_REPLICA: ${{ matrix.replica }}
      PROBE_DELAYS: '[30]'
      PROBE_OFFSETS: '[30,45,60]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Measure only independently owned test-zone records
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
          HUAWEICLOUD_DNS_ZONE: ${{ vars.HUAWEICLOUD_DNS_ZONE }}
          HUAWEICLOUD_DNS_REGION: ${{ vars.HUAWEICLOUD_DNS_REGION }}
        run: uv run --no-project --with huaweicloudsdkdns==3.1.198 --with dnspython==2.8.0 python dns_probe.py run
      - name: Independently verify cleanup even after failure
        if: always()
        env:
          HUAWEICLOUD_AK: ${{ secrets.HUAWEICLOUD_AK }}
          HUAWEICLOUD_SK: ${{ secrets.HUAWEICLOUD_SK }}
          HUAWEICLOUD_DNS_ZONE: ${{ vars.HUAWEICLOUD_DNS_ZONE }}
          HUAWEICLOUD_DNS_REGION: ${{ vars.HUAWEICLOUD_DNS_REGION }}
        run: uv run --no-project --with huaweicloudsdkdns==3.1.198 --with dnspython==2.8.0 python dns_probe.py cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dns-propagation-${{ matrix.replica }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: error
