name: Backend Tests

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --all-groups
      - name: Collect the complete test inventory
        id: collect
        run: |
          uv run pytest tests --collect-only --run-docker -q -o addopts= --collection-manifest .test-manifests/expected.json
          matrix=$(uv run python tests/support/collection.py matrix .test-manifests/expected.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-test-inventory
          overwrite: true
          path: backend/.test-manifests/expected.json
          include-hidden-files: true
          if-no-files-found: error

  pytest:
    name: pytest (${{ matrix.test_group }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: backend
    env:
      FD_BINARY_PATH: /usr/local/bin/fd
      MCMAP_BINARY_PATH: /usr/local/bin/mcmap
      RESTIC_BINARY_PATH: /usr/local/bin/restic
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 curl

      - name: Install fd test dependency
        run: |
          dockerfile="${GITHUB_WORKSPACE}/Dockerfile"
          fd_version="$(awk -F= '$1 == "ARG FD_VERSION" { print $2 }' "$dockerfile")"
          fd_sha256="$(awk -F= '$1 == "ARG FD_SHA256" { print $2 }' "$dockerfile")"
          if [ -z "$fd_version" ] || [ -z "$fd_sha256" ]; then
            echo "Failed to read FD_VERSION or FD_SHA256 from ${dockerfile}" >&2
            exit 1
          fi
          curl -L "https://github.com/sharkdp/fd/releases/download/${fd_version}/fd-${fd_version}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/fd.tar.gz
          echo "${fd_sha256}  /tmp/fd.tar.gz" | sha256sum -c -
          tmpdir="$(mktemp -d)"
          tar -xzf /tmp/fd.tar.gz -C "$tmpdir"
          sudo install -m 0755 "$tmpdir/fd-${fd_version}-x86_64-unknown-linux-musl/fd" /usr/local/bin/fd
          rm -rf "$tmpdir" /tmp/fd.tar.gz
          fd --version

      - name: Install 7z test dependencies
        if: contains(matrix.capabilities, '7z')
        run: sudo apt-get install -y p7zip-full

      - name: Install restic test dependencies
        if: contains(matrix.capabilities, 'restic')
        run: |
          dockerfile="${GITHUB_WORKSPACE}/Dockerfile"
          restic_version="$(awk -F= '$1 == "ARG RESTIC_VERSION" { print $2 }' "$dockerfile")"
          restic_sha256="$(awk -F= '$1 == "ARG RESTIC_SHA256" { print $2 }' "$dockerfile")"
          if [ -z "$restic_version" ] || [ -z "$restic_sha256" ]; then
            echo "Failed to read RESTIC_VERSION or RESTIC_SHA256 from ${dockerfile}" >&2
            exit 1
          fi
          curl -L "https://github.com/restic/restic/releases/download/v${restic_version}/restic_${restic_version}_linux_amd64.bz2" -o /tmp/restic.bz2
          echo "${restic_sha256}  /tmp/restic.bz2" | sha256sum -c -
          tmpdir="$(mktemp -d)"
          bunzip2 -c /tmp/restic.bz2 > "$tmpdir/restic"
          sudo install -m 0755 "$tmpdir/restic" /usr/local/bin/restic
          rm -rf "$tmpdir" /tmp/restic.bz2
          restic version

      - name: Verify Docker test dependencies
        if: contains(matrix.capabilities, 'docker')
        run: |
          docker version
          docker compose version

      - name: Install mcmap test dependencies
        if: contains(matrix.capabilities, 'mcmap')
        run: |
          dockerfile="${GITHUB_WORKSPACE}/Dockerfile"
          mcmap_version="$(awk -F= '$1 == "ARG MCMAP_VERSION" { print $2 }' "$dockerfile")"
          mcmap_sha256="$(awk -F= '$1 == "ARG MCMAP_SHA256" { print $2 }' "$dockerfile")"
          if [ -z "$mcmap_version" ] || [ -z "$mcmap_sha256" ]; then
            echo "Failed to read MCMAP_VERSION or MCMAP_SHA256 from ${dockerfile}" >&2
            exit 1
          fi
          curl -L "https://github.com/xyqyear/mcmap/releases/download/${mcmap_version}/mcmap-${mcmap_version}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/mcmap.tar.gz
          echo "${mcmap_sha256}  /tmp/mcmap.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/mcmap.tar.gz -C /usr/local/bin --strip-components=1
          sudo chmod +x /usr/local/bin/mcmap
          mcmap --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest tests --test-group "${{ matrix.test_group }}" --run-docker --require-capabilities --collection-manifest ".test-manifests/${{ matrix.test_group }}.json"

      - name: Publish executed collection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-group-${{ matrix.test_group }}
          overwrite: true
          path: backend/.test-manifests/${{ matrix.test_group }}.json
          include-hidden-files: true
          if-no-files-found: error

  collection-audit:
    if: always() && needs.discover.result == 'success'
    needs: [discover, pytest]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/download-artifact@v8
        with:
          name: backend-test-inventory
          path: backend/.test-manifests
      - uses: actions/download-artifact@v8
        with:
          pattern: backend-test-group-*
          merge-multiple: true
          path: backend/.test-manifests/groups
      - name: Verify complete duplicate-free test collection
        run: uv run --no-project python tests/support/collection.py audit .test-manifests/expected.json .test-manifests/groups/*.json

      - name: Require successful execution as well as complete collection
        env:
          EXECUTION_RESULT: ${{ needs.pytest.result }}
        run: test "$EXECUTION_RESULT" = success
