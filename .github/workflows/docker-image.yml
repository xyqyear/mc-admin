name: Qualify and Publish Application

on:
  push:
    branches: ["**"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the verified artifact (requires a semantic version tag ref)
        type: boolean
        default: false
      force_full:
        description: Execute complete qualification even when matching evidence exists
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      verification: ${{ steps.identity.outputs.verification }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - id: identity
        run: uv run --no-project python -m scripts.release.reuse identity --github-output "$GITHUB_OUTPUT"

  qualification:
    needs: identity
    concurrency:
      group: content-qualification-${{ needs.identity.outputs.verification }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/qualification.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      force_full: ${{ inputs.force_full || false }}

  promote:
    needs: qualification
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.qualification.outputs.candidate }}
          path: candidate-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.qualification.outputs.receipt }}
          path: qualification
      - name: Validate the release tag
        id: release-tag
        run: |
          uv run --no-project python scripts/release/tags.py validate \
            --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Validate immutable inputs
        run: |
          uv run --no-project python -m scripts.release.reuse verify --directory candidate-artifacts --receipt qualification/qualification.json
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ steps.release-tag.outputs.stable }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release-tag.outputs.stable }}
            type=semver,pattern={{major}},enable=${{ steps.release-tag.outputs.stable }}
            type=sha
      - name: Promote the tested manifest without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          uv run --no-project python scripts/release/tags.py check \
            --tag "$GITHUB_REF_NAME" --image "ghcr.io/$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" --tags "$IMAGE_TAGS"
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          destinations=()
          while IFS= read -r image; do
            if [ -n "$image" ]; then destinations+=(--destination "$image"); fi
          done <<< "$IMAGE_TAGS"
          uv run --no-project python scripts/release/candidate.py promote \
            --directory candidate-artifacts --revision "${{ github.sha }}" \
            --receipt qualification/qualification.json \
            "${destinations[@]}" --output promotion.json
          cat promotion.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: application-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion.json
          if-no-files-found: error
          retention-days: 90
